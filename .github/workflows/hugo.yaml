name: Build and deploy Hugo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .hugo-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          mkdir -p "$RUNNER_TEMP/hugo-bin"

          curl -fsSL --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/hugo.tar.gz"

          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" \
            -C "$RUNNER_TEMP/hugo-bin" hugo

          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build website
        run: |
          hugo version
          hugo build --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5